spring.application.name=orchestro-ai-agent

# Worker service — no HTTP server.
spring.main.web-application-type=none

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Gemini via Google's OpenAI-compatible endpoint
ai-agent.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/openai
ai-agent.gemini.api-key=${GEMINI_API_KEY}
ai-agent.gemini.model=gemini-2.5-flash-lite

# GitHub — PAT of the dedicated AI-agent account (clone, push, PR creation)
ai-agent.github.token=${GITHUB_TOKEN}
ai-agent.git.author-name=${GIT_AUTHOR_NAME:orchestro-ai-agent}
ai-agent.git.author-email=${GIT_AUTHOR_EMAIL:ai-agent@orchestro.local}

# Orchestro backend — task status callbacks
orchestro.base-url=${ORCHESTRO_BASE_URL:http://localhost:8080}
orchestro.agent.username=${ORCHESTRO_AGENT_USER:ai-agent}
orchestro.agent.password=${ORCHESTRO_AGENT_PASS}
